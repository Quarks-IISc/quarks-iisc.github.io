<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 20" shape-rendering="crispEdges" role="img" aria-label="Pixel duck">
  <!-- tail -->
  <rect x="2"  y="10" width="2"  height="2" fill="#f5b301"/>
  <rect x="3"  y="9"  width="2"  height="1" fill="#f5b301"/>
  <!-- body -->
  <rect x="5"  y="11" width="13" height="1" fill="#f5b301"/>
  <rect x="4"  y="12" width="15" height="5" fill="#f5b301"/>
  <rect x="6"  y="17" width="11" height="1" fill="#f5b301"/>
  <!-- wing -->
  <rect x="7"  y="13" width="7"  height="3" fill="#d9990b"/>
  <rect x="8"  y="16" width="5"  height="1" fill="#d9990b"/>
  <rect x="6"  y="11" width="4"  height="1" fill="#ffd24a"/>
  <!-- neck -->
  <rect x="15" y="9"  width="5"  height="4" fill="#f5b301"/>
  <!-- head: three rows of crown above the glasses, so they read as glasses
       and not as a cap -->
  <rect x="14" y="2"  width="8"  height="8" fill="#f5b301"/>
  <rect x="15" y="1"  width="6"  height="1" fill="#ffd24a"/>
  <!-- sunglasses, like the poster's: a thin brow bar and two separated lenses -->
  <rect x="13" y="5"  width="10" height="1" fill="#14121a"/>
  <rect x="14" y="6"  width="3"  height="2" fill="#14121a"/>
  <rect x="19" y="6"  width="3"  height="2" fill="#14121a"/>
  <!-- beak -->
  <rect x="22" y="7"  width="3"  height="2" fill="#ee7b3c"/>
  <rect x="22" y="9"  width="2"  height="1" fill="#d96528"/>
</svg>
