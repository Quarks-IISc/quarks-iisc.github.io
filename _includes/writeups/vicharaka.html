    <h3 class="club-writeup-heading">About Vicharaka</h3>
    <div class="club-writeup-rule"></div>

    <p>Vicharaka is the undergraduate robotics club of IISc &mdash; where thinkers and tinkerers come together to design, build and bring machines to life. From circuits and code to fully autonomous systems, it&rsquo;s a space for anyone who likes to make things move.</p>
