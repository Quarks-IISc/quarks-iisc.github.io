---
layout: default
---


<section>
    <div class="section-title section-hero-header">
        <h2><span>{{ page.title | markdownify | remove: '<p>' | remove: '</p>' }}</span></h2>
    </div>

    <div class="article-post">
    {{content}}
    </div>

    {% if page.comments == true %}

    <div id="comments" class="row mb-5">
        <div class="col-md-8">
            {% include disqus.html %}
        </div>
    </div>

    {% endif %}
</section>
