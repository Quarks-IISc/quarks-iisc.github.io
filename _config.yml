# Site
name: "Quarks"
title: "Quarks"
description: "By IISc UG"
logo: "assets/images/logo.png"
favicon: "assets/images/logo.png"
baseurl: ""
#baseurl: /
url: "https://quarks.ug.iisc.ac.in"
# Set to false to turn off the faint background doodle pattern site-wide
doodles: false
# google_analytics: 'UA-46278016-1'
# disqus: 'demowebsite'
# mailchimp-list: 'https://wowthemes.us11.list-manage.com/subscribe/post?u=8aeb20a530e124561927d3bd8&amp;id=8c3d2d214b'
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  sal:
    name: Sal
    display_name: Sal
    gravatar: e56154546cf4be74e393c62d1ae9f9d4
    email: wowthemesnet@gmail.com
    web: https://www.wowthemes.net
    twitter: https://twitter.com/wowthemesnet
    description: "Author of Mediumish, a Bootstrap Medium styled template available for WordPress, HTML, Ghost and Jekyll. You are currently previewing Jekyll template demo."
  john:
    name: John
    display_name: John
    avatar: "assets/images/avatar.png"
    gravatar: b1cc14991db7a456fcd761680bbc8f81
    email: wowthemesnet@gmail.com
    web: https://www.wowthemes.net
    twitter: https://twitter.com/wowthemesnet
    description: "This is the author box. Write a short description of the author here. You are currently previewing Mediumish demo, a Jekyll template compatible with Github pages."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives

# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: "/category/:name/"

# Pagination
paginate: 6
paginate_path: /page:num/

# Other
markdown: kramdown
future: true
timezone: Asia/Kolkata

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

# Student Hub sign-in: Microsoft login (MSAL) checked by a Supabase Edge
# Function. Code: assets/js/student-hub-auth.js, supabase/functions/verify-session.
student_hub:
  # Microsoft Entra app shared with course-review. Logins only work once that
  # app lists these as "Single-page application" redirect URIs
  # (otherwise Microsoft shows error AADSTS50011):
  #   https://quarks.ug.iisc.ac.in/student-hub/
  #   http://localhost:4000/student-hub/
  msal_client_id: "2b7a3439-67d5-4cb0-b8d1-a244078196e3"
  # Supabase project shared with course-review. verify-session must be
  # deployed there (see supabase/functions/verify-session/README.md).
  verify_session_url: "https://hojlmrrgkqvchqyggmbb.supabase.co/functions/v1/verify-session"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock, supabase]
